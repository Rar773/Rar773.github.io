<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstantNews — Follow on Telegram</title>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@InstantNews73">
  <meta name="twitter:title" content="Follow InstantNews on Telegram">
  <meta name="twitter:description" content="Get live breaking news alerts 24/7 — fastest financial & geopolitical news feed.">
  <meta name="twitter:image" content="https://instantnews24.net/telegram-banner.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://instantnews24.net/telegram">
  <meta property="og:title" content="Follow InstantNews on Telegram">
  <meta property="og:description" content="Get live breaking news alerts 24/7 — fastest financial & geopolitical news feed.">
  <meta property="og:image" content="https://instantnews24.net/telegram-banner.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0b;
      color: #f0f0f0;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 16px;
      color: #888;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #ff2d2d;
      color: #fff;
      padding: 16px 40px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">⚡</div>
    <h1>Follow InstantNews on Telegram</h1>
    <p>Get live breaking news alerts 24/7 — financial & geopolitical news.</p>
    <a href="https://t.me/FastestNewsFeed" class="btn">Join @FastestNewsFeed</a>
  </div>
  <script>
    // Auto-redirect after 1s
    setTimeout(() => { window.location.href = 'https://t.me/FastestNewsFeed'; }, 1000);
  </script>
</body>
</html>
